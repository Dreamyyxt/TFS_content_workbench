<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据看板 · 改版对照</title><style>
*{box-sizing:border-box}body{margin:0;padding:38px 24px;background:#f2ede6;color:#433b32;font-family:system-ui,-apple-system,sans-serif}main{max-width:1400px;margin:auto}header small{font-size:10px;letter-spacing:3px;color:#927760}h1{font-size:27px;font-weight:550;margin:16px 0 10px}p{font-size:13px;color:#8c7c6e;line-height:1.9}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{padding:11px 20px;border:1px solid #fff9;border-radius:11px;background:#f7f1e9;color:#7c5b44;box-shadow:4px 4px 9px #cbbba777,-4px -4px 9px #fff;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#e9ddce;box-shadow:inset 2px 2px 5px #c9b59c66,inset -2px -2px 5px #fff8}button:focus-visible{outline:2px solid #946b4e;outline-offset:3px}figure{margin:0}figcaption{font-size:12px;color:#8c7c6e;margin-bottom:14px;line-height:1.8}img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:8px 10px 24px #cbbba755;border:1px solid #fff9}.mobile img{max-width:390px;margin:auto}[hidden]{display:none!important}@media(max-width:600px){body{padding:26px 16px}h1{font-size:23px}button{padding:10px 12px}}
</style></head><body><main><header><small>THE FIFTH SEASON · CONTENT ANALYTICS</small><h1>从作品表现，回到创作的起点。</h1><p>选择复盘时间与账号，搜索作品；指标、图表与选题回溯同步更新。明细可按播放量与完播率排序。<br>以下为同一组隔离示例数据的实际浏览器截图，不连接云端。</p></header><nav aria-label="数据看板改版对照"><button type="button" aria-pressed="true" data-panel="after">改版后</button><button type="button" aria-pressed="false" data-panel="before">改版前</button><button type="button" aria-pressed="false" data-panel="sources">选题回溯</button><button type="button" aria-pressed="false" data-panel="mobile">手机布局</button></nav><figure id="after"><figcaption>新增复盘范围：全部时间、近 7 天、近 30 天与未填日期。支持账号、标题、平台与备注组合筛选。</figcaption><img src="dashboard.png" alt="新版数据看板的复盘范围和筛选后的指标图表"></figure><figure id="before" hidden><figcaption>原版只支持账号筛选，作品明细没有排序入口，选题回溯停留在榜单展示。</figcaption><img src="before.png" alt="改版前的数据看板"></figure><figure id="sources" hidden><figcaption>有实际来源的作品可回看原选题与脚本；没有关联的作品明确提示，不根据标题猜测。</figcaption><img src="sources.png" alt="选题回溯榜单及原选题、脚本入口"></figure><figure id="mobile" class="mobile" hidden><figcaption>手机上时间范围分成两列，当前范围和数量完整展示；明细支持键盘与横向滚动。</figcaption><img src="mobile.png" alt="手机上的数据复盘范围"></figure><p>近 7 / 30 天按上海日期计算并包含今天。清除筛选保留明细排序；回溯仅使用已有的排期关联。</p></main><script>document.querySelector('nav').addEventListener('click',event=>{const button=event.target.closest('[data-panel]');if(!button)return;document.querySelectorAll('nav button').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));document.querySelectorAll('figure').forEach(el=>el.hidden=el.id!==button.dataset.panel)});</script></body></html>
