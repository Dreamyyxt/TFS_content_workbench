<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品数据导入 · 验收预览</title><style>body{margin:0;padding:32px;font:16px/1.7 system-ui;background:#eee8df;color:#493a30}main{max-width:1400px;margin:auto}img{max-width:100%;height:auto;border-radius:14px}section{margin:36px 0}p{color:#756458}.mobile{max-width:390px}</style><main><h1>创作者中心 Excel 导入</h1><p>选择文件 → 选择所属账号 → 核对数据 → 确认导入。以下仅为合成测试数据，未展示用户真实导出内容。</p><section><h2>抖音 · 桌面预览</h2><p>默认跳过已导入作品；也可明确选择更新，或取消勾选某一行。完整完播率与 3 秒完播率分别处理。</p><img src="preview-1500.png" alt="Excel 导入预览与账号选择"></section><section><h2>手机预览</h2><p>设置纵向排列，数据表可横向滚动查看全部字段。</p><img class="mobile" src="preview-390.png" alt="手机 Excel 导入预览"></section><section><h2>小红书 · 桌面预览</h2><p>同一入口识别笔记明细，选择小红书或双平台账号。显示观看量、曝光、封面点击率，展开查看人均观看时长与弹幕。</p><img src="xiaohongshu-1500.png" alt="小红书笔记导入预览"></section><section><h2>小红书 · 手机预览</h2><img class="mobile" src="xiaohongshu-390.png" alt="手机小红书导入预览"></section></main>
