<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关注主题与分步选题 · 预览</title><style>
*{box-sizing:border-box}body{margin:0;padding:36px 24px;background:#eae4dc;color:#332b26;font-family:system-ui,-apple-system,sans-serif}main{max-width:1200px;margin:auto}header small{font-size:10px;letter-spacing:2px;color:#75665b}h1{font-size:28px;font-weight:600;margin:15px 0 10px}p,figcaption{font-size:13px;line-height:1.9;color:#6b5d53}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{min-height:44px;padding:10px 17px;border:1px solid #c6b8a8;border-radius:10px;background:#fcf9f4;color:#6e432f;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#80513c;color:#fffaf6;border-color:#80513c}button:focus-visible{outline:2px solid #8a5a44;outline-offset:3px}figure{margin:0}figcaption{margin-bottom:14px}img{display:block;width:100%;height:auto;border:1px solid #c6b8a8;border-radius:16px;box-shadow:0 5px 14px #68513a14}.mobile img{max-width:390px;margin:auto}[hidden]{display:none!important}@media(max-width:600px){body{padding:24px 14px}h1{font-size:23px}}
</style></head><body><main><header><small>THE FIFTH SEASON · TOPIC DISCOVERY</small><h1>先找到值得关注的内容，再决定怎么拍。</h1><p>加入品牌、款式或场景，获取这一期的近期作品与热点。查看来源后，按各账号定位生成选题，经 Humanizer 改写与复查再入库。<br>本页是隔离测试数据的浏览器截图，enoi、maogel、婚甲的结果仅用于演示，不代表真实热点或实际采集结果。</p></header>
<nav aria-label="功能预览"><button aria-pressed="true" data-panel="discovery">关注主题与风向</button><button aria-pressed="false" data-panel="topics">生成后的选题</button><button aria-pressed="false" data-panel="accounts">账号管理</button><button aria-pressed="false" data-panel="materials-mobile">手机关注主题</button><button aria-pressed="false" data-panel="profile-mobile">手机账号管理</button></nav>
<figure id="discovery"><figcaption>获取风向与生成选题分为两个步骤。关注主题会进入实际搜索；没有近期来源的主题如实标注。</figcaption><img src="discovery.png" alt="关注主题标签、近期来源数量和独立生成选题入口"></figure>
<figure id="topics" hidden><figcaption>点击生成后，先按各账号定位写初稿，再由 Humanizer 改写与复查。生成复用已保存的风向，不再次采集。</figcaption><img src="topics.png" alt="按账号生成的测试选题"></figure>
<figure id="accounts" hidden><figcaption>新增与删除按钮可直接看到。删除账号后，保存规则才生效；历史内容保留，账号可恢复。</figcaption><img src="accounts.png" alt="账号列表的可见删除按钮与恢复区域"></figure>
<figure id="materials-mobile" class="mobile" hidden><figcaption>手机端可添加、移除和保存关注主题。</figcaption><img src="materials-mobile.png" alt="手机上的关注主题表单"></figure>
<figure id="profile-mobile" class="mobile" hidden><figcaption>手机端的账号信息与删除操作。</figcaption><img src="profile-mobile.png" alt="手机上的新增和删除账号按钮"></figure>
</main><script>document.querySelector('nav').addEventListener('click',event=>{const button=event.target.closest('[data-panel]');if(!button)return;document.querySelectorAll('nav button').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));document.querySelectorAll('figure').forEach(el=>el.hidden=el.id!==button.dataset.panel)});</script></body></html>
