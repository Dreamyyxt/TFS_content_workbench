<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进度看板 · 改版对照</title><style>
*{box-sizing:border-box}body{margin:0;padding:38px 24px;background:#f2ede6;color:#433b32;font-family:system-ui,-apple-system,sans-serif}main{max-width:1400px;margin:auto}header small{font-size:10px;letter-spacing:3px;color:#927760}h1{font-size:27px;font-weight:550;margin:16px 0 10px}p{font-size:13px;color:#8c7c6e;line-height:1.9}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{padding:11px 20px;border:1px solid #fff9;border-radius:11px;background:#f7f1e9;color:#7c5b44;box-shadow:4px 4px 9px #cbbba777,-4px -4px 9px #fff;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#e9ddce;box-shadow:inset 2px 2px 5px #c9b59c66,inset -2px -2px 5px #fff8}button:focus-visible{outline:2px solid #946b4e;outline-offset:3px}figure{margin:0}figcaption{font-size:12px;color:#8c7c6e;margin-bottom:14px;line-height:1.8}img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:8px 10px 24px #cbbba755;border:1px solid #fff9}.mobile img{max-width:390px;margin:auto}[hidden]{display:none!important}@media(max-width:600px){body{padding:26px 16px}h1{font-size:23px}button{padding:10px 12px}}
</style></head><body><main><header><small>THE FIFTH SEASON · CREATIVE MOMENTUM</small><h1>让每一步，都有下一步。</h1><p>待补脚本、待补日期、待核对发布分开处理，点击可定位具体内容。阶段概览注明各自统计范围。<br>以下为同一组隔离示例数据的实际浏览器截图，不连接云端。</p></header><nav aria-label="进度看板改版对照"><button type="button" aria-pressed="true" data-panel="after">改版后</button><button type="button" aria-pressed="false" data-panel="before">改版前</button><button type="button" aria-pressed="false" data-panel="sources">阶段概览</button><button type="button" aria-pressed="false" data-panel="mobile">手机布局</button></nav><figure id="after"><figcaption>接下来处理：三类待办展示真实数量，桌面双列、手机单列。初始显示 6 条，可继续展开。</figcaption><img src="progress.png" alt="新版进度看板的待办卡片与继续处理入口"></figure><figure id="before" hidden><figcaption>原版以数量、漏斗和风险摘要为主，缺少定位具体内容的待办入口。</figcaption><img src="before.png" alt="改版前的进度看板"></figure><figure id="sources" hidden><figcaption>各阶段数量来自不同范围，分别注明来源；本周录入、拍摄日负载和发布计划使用实际记录。</figcaption><img src="stages.png" alt="创作阶段概览和本周拍摄发布安排"></figure><figure id="mobile" class="mobile" hidden><figcaption>手机上待办类别与具体内容单列排列，按钮和说明完整保留。</figcaption><img src="mobile.png" alt="手机上的进度待办"></figure><p>计划时间到达不会被当作已经发布。录入表现仅打开原表单，仍由你确认并保存。</p></main><script>document.querySelector('nav').addEventListener('click',event=>{const button=event.target.closest('[data-panel]');if(!button)return;document.querySelectorAll('nav button').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));document.querySelectorAll('figure').forEach(el=>el.hidden=el.id!==button.dataset.panel)});</script></body></html>
