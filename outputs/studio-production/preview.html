<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频制作 · 改版对照</title><style>
*{box-sizing:border-box}body{margin:0;padding:38px 24px;background:#f2ede6;color:#433b32;font-family:system-ui,-apple-system,sans-serif}main{max-width:1400px;margin:auto}header small{font-size:10px;letter-spacing:3px;color:#927760}h1{font-size:27px;font-weight:550;margin:16px 0 10px}p{font-size:13px;color:#8c7c6e;line-height:1.9}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{padding:11px 20px;border:1px solid #fff9;border-radius:11px;background:#f7f1e9;color:#7c5b44;box-shadow:4px 4px 9px #cbbba777,-4px -4px 9px #fff;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#e9ddce;box-shadow:inset 2px 2px 5px #c9b59c66,inset -2px -2px 5px #fff8}button:focus-visible{outline:2px solid #946b4e;outline-offset:3px}figure{margin:0}figcaption{font-size:12px;color:#8c7c6e;margin-bottom:14px;line-height:1.8}img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:8px 10px 24px #cbbba755;border:1px solid #fff9}.mobile img{max-width:390px;margin:auto}[hidden]{display:none!important}@media(max-width:600px){body{padding:26px 16px}h1{font-size:23px}button{padding:10px 12px}}
</style></head><body><main><header><small>THE FIFTH SEASON · PRODUCTION STUDIO</small><h1>备好内容，看清每一步制作。</h1><p>提交前检查内容、素材和连接；任务按真实状态筛选，每条任务显示下一步。<br>以下为模拟服务与隔离任务的浏览器截图，没有执行真实制作、上传或导出。</p></header><nav aria-label="视频制作改版对照"><button type="button" aria-pressed="true" data-panel="after">改版后</button><button type="button" aria-pressed="false" data-panel="before">改版前</button><button type="button" aria-pressed="false" data-panel="sources">提交前准备</button><button type="button" aria-pressed="false" data-panel="mobile">手机布局</button></nav><figure id="after"><figcaption>状态筛选和搜索可组合使用，任务卡片显示下一步，失败和待核对提交保留各自入口。</figcaption><img src="tasks.png" alt="新版制作任务列表与筛选"></figure><figure id="before" hidden><figcaption>原版按时间排列所有任务，没有状态筛选和搜索，下一步分散在操作和详情中。</figcaption><img src="before.png" alt="改版前的制作任务"></figure><figure id="sources" hidden><figcaption>内容、素材和连接随模式更新：生成可以只用脚本；剪辑需要实拍素材，上传配乐需要音频。</figcaption><img src="preparation.png" alt="视频制作提交前准备"></figure><figure id="mobile" class="mobile" hidden><figcaption>手机任务卡片纵向排列，保留状态、下一步和核对入口。</figcaption><img src="mobile.png" alt="手机上的制作任务"></figure><p>剪映草稿仍需在剪映内检查和导出 MP4。筛选不触发制作；刷新保留核对输入、展开详情和键盘焦点。</p></main><script>document.querySelector('nav').addEventListener('click',event=>{const button=event.target.closest('[data-panel]');if(!button)return;document.querySelectorAll('nav button').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));document.querySelectorAll('figure').forEach(el=>el.hidden=el.id!==button.dataset.panel)});</script></body></html>
