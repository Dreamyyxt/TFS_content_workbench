<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脚本库 · 改版对照</title><style>
*{box-sizing:border-box}body{margin:0;padding:38px 24px;background:#f2ede6;color:#433b32;font-family:system-ui,-apple-system,sans-serif}main{max-width:1400px;margin:auto}header small{font-size:10px;letter-spacing:3px;color:#927760}h1{font-size:27px;font-weight:550;margin:16px 0 10px}p{font-size:13px;color:#8c7c6e;line-height:1.9}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{padding:11px 20px;border:1px solid #fff9;border-radius:11px;background:#f7f1e9;color:#7c5b44;box-shadow:4px 4px 9px #cbbba777,-4px -4px 9px #fff;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#e9ddce;box-shadow:inset 2px 2px 5px #c9b59c66,inset -2px -2px 5px #fff8}button:focus-visible{outline:2px solid #946b4e;outline-offset:3px}figure{margin:0}figcaption{font-size:12px;color:#8c7c6e;margin-bottom:14px;line-height:1.8}img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:8px 10px 24px #cbbba755;border:1px solid #fff9}.mobile img{max-width:390px;margin:auto}[hidden]{display:none!important}@media(max-width:600px){body{padding:26px 16px}h1{font-size:23px}button{padding:10px 12px}}
</style></head><body><main><header><small>THE FIFTH SEASON · SCRIPT COLLECTION</small><h1>先看见画面，再开始拍摄。</h1><p>分镜拆成可扫读的预览，常用操作放在一起。支持创建时间与标题排序，筛选无结果时可一键恢复。<br>以下为同一组隔离示例数据的实际浏览器截图，不连接云端。</p></header><nav aria-label="脚本库改版对照"><button type="button" aria-pressed="true" data-panel="after">改版后</button><button type="button" aria-pressed="false" data-panel="before">改版前</button><button type="button" aria-pressed="false" data-panel="mobile">手机布局</button></nav><figure id="after"><figcaption>分镜脚本直接展示前两镜的时间、画面与口播；查看完整脚本、拍摄模式和制作入口清晰分开。</figcaption><img src="library.png" alt="新版脚本库的分镜预览、排序和常用操作"></figure><figure id="before" hidden><figcaption>原版将分镜表截为一段文字，查看、拍摄、制作、自检和删除集中在卡片底部。</figcaption><img src="before.png" alt="改版前的脚本库卡片"></figure><figure id="mobile" class="mobile" hidden><figcaption>手机上分镜纵向排列，保留原文预览和全部操作；自检与管理可以展开。</figcaption><img src="mobile.png" alt="手机上的分镜卡片"></figure><p>预览不改写脚本。表格无法可靠识别时保留原文；自检修正和删除仍需原有确认。</p></main><script>document.querySelector('nav').addEventListener('click',event=>{const button=event.target.closest('[data-panel]');if(!button)return;document.querySelectorAll('nav button').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));document.querySelectorAll('figure').forEach(el=>el.hidden=el.id!==button.dataset.panel)});</script></body></html>
