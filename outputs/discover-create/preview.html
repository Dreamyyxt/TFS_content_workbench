<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第五季 · Discover / Create 预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#eae4dc;color:#332b26;font:14px/1.8 system-ui,-apple-system,sans-serif;padding:32px 24px}main{max-width:1200px;margin:auto}h1{font-size:27px;font-weight:550;margin:8px 0}p{color:#75665b;margin:8px 0 24px}small{color:#8a5a44;letter-spacing:2px}nav{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}button{font:inherit;font-size:12px;min-height:42px;padding:9px 15px;border:1px solid #c6b8a8;border-radius:7px;background:#fcf9f4;color:#6e432f;cursor:pointer}button[aria-pressed=true]{background:#8a5a44;border-color:#8a5a44;color:#fffaf6}button:focus-visible{outline:2px solid #8a5a44;outline-offset:4px}figure{margin:0}figcaption{font-size:13px;color:#75665b;margin-bottom:16px}img{display:block;width:100%;height:auto;border:1px solid #d4c7b8;border-radius:12px}.mobile img{max-width:390px;margin:auto}[hidden]{display:none!important}@media(max-width:600px){body{padding:22px 14px}h1{font-size:23px}}
</style></head><body><main><small>THE FIFTH SEASON</small><h1>先选题，再生成。</h1><p>页面收成 Discover 与 Create 两个主区域。减少嵌套色块，统一标签和卡片操作。<br>以下为隔离测试数据的界面截图，部分标题取自反馈示例；风向来源为演示，不代表真实采集结果。</p>
<nav aria-label="选择预览"><button data-panel="overview" aria-pressed="true">页面总览</button><button data-panel="discover" aria-pressed="false">Discover 展开结果</button><button data-panel="create" aria-pressed="false">Create 与主题库</button><button data-panel="mobile" aria-pressed="false">手机页面</button><button data-panel="card-mobile" aria-pressed="false">手机卡片详情</button></nav>
<figure id="overview"><figcaption>关注主题、按钮和风向结果共用第一个区域。账号生成与主题库共用第二个区域。</figcaption><img src="overview.png" alt="Discover 与 Create 两个主区域的页面总览"></figure>
<figure id="discover" hidden><figcaption>风向结果可独立展开、收起；关注主题与采集操作始终可用。</figcaption><img src="discover.png" alt="关注主题与展开的最新风向"></figure>
<figure id="create" hidden><figcaption>取消开场大色块。标签统一为同色、同尺寸；脚本状态与查看入口成行，选择按钮固定在底部。</figcaption><img src="create.png" alt="按账号生成入口与简化后的主题库"></figure>
<figure id="mobile" class="mobile" hidden><figcaption>手机上同样按两个区域顺序阅读和操作。</figcaption><img src="mobile.png" alt="手机上的选题与生成页面"></figure>
<figure id="card-mobile" class="mobile" hidden><figcaption>展开后以文字层级展示角度、目标与理由，删除入口始终可见。</figcaption><img src="card-mobile.png" alt="简化后的手机选题卡片详情"></figure>
</main><script>document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-panel]');if(!b)return;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('figure').forEach(x=>x.hidden=x.id!==b.dataset.panel)});</script></body></html>
