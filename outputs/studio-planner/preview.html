<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拍摄与发布周历 · 效果预览</title><style>
*{box-sizing:border-box}body{margin:0;padding:40px 24px;background:#f2ede6;color:#433b32;font-family:system-ui,-apple-system,sans-serif}main{max-width:1320px;margin:auto}header{margin-bottom:25px}header small{letter-spacing:3px;color:#927760;font-size:10px}h1{font-size:28px;font-weight:550;margin:15px 0 10px}p{font-size:13px;line-height:1.9;color:#8c7c6e}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{cursor:pointer;padding:11px 20px;border:1px solid #fff9;border-radius:11px;background:#f7f1e9;color:#7c5b44;box-shadow:4px 4px 9px #cbbba777,-4px -4px 9px #fff;font:inherit;font-size:13px}button[aria-pressed=true]{background:#e9ddce;box-shadow:inset 2px 2px 5px #c9b59c66,inset -2px -2px 5px #fff8}button:focus-visible{outline:2px solid #946b4e;outline-offset:3px}figure{margin:0}figcaption{font-size:12px;color:#8c7c6e;margin-bottom:14px;line-height:1.8}img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:8px 10px 24px #cbbba755;border:1px solid #fff9}.mobile img{max-width:390px;margin:auto}video{width:100%;border-radius:16px;background:#e8dfd3}[hidden]{display:none!important}footer{margin-top:24px}a{color:#875b40}@media(max-width:600px){body{padding:26px 16px}h1{font-size:23px}button{padding:10px 12px}}
</style></head><body><main><header><small>THE FIFTH SEASON · PLANNING WORKSPACE</small><h1>从一张长表，到这一周的创作安排。</h1><p>发布按七天展开，拍摄按实际工作日集中。切换账号后，内容和数量一起更新。<br>以下是隔离示例数据的实际浏览器截图与操作录屏，不连接云端。</p></header><nav aria-label="预览画面"><button type="button" aria-pressed="true" data-panel="publish">发布周历</button><button type="button" aria-pressed="false" data-panel="shoot">拍摄安排</button><button type="button" aria-pressed="false" data-panel="mobile">手机布局</button><button type="button" aria-pressed="false" data-panel="recording">操作录屏</button></nav><figure id="publish"><figcaption>整周的发布时间、账号与内容放在一起；可以直接查看脚本或录入表现。日期缺失的内容单独保留。</figcaption><a href="publish.png"><img src="publish.png" alt="新版发布周历，七个日期列和内容卡片"></a></figure><figure id="shoot" hidden><figcaption>只展开实际有拍摄安排的日期，同一天的脚本集中查看，可直接进入拍摄模式。</figcaption><a href="shoot.png"><img src="shoot.png" alt="按周二和周五集中展示的拍摄内容卡片"></a></figure><figure id="mobile" class="mobile" hidden><figcaption>手机上改为按天排列的单列卡片，保留账号筛选、切周与内容操作。</figcaption><img src="mobile.png" alt="手机上的发布安排"></figure><figure id="recording" hidden><figcaption>实际浏览器操作：切换视角、筛选账号、打开脚本与拍摄模式、切周及录入表单。</figcaption><video controls preload="metadata" src="planner.webm"></video></figure><footer><p>原有生成排期入口保留在页面上方的「生成新排期」中。计划时间已到不代表内容已发布。</p></footer></main><script>
document.querySelector('nav').addEventListener('click',event=>{const button=event.target.closest('[data-panel]');if(!button)return;document.querySelectorAll('nav button').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));document.querySelectorAll('figure').forEach(el=>el.hidden=el.id!==button.dataset.panel);if(button.dataset.panel!=='recording')document.querySelector('video').pause()});
</script></body></html>
