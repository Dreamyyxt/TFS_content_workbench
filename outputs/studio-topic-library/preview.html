<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选题库 · 改版对照</title><style>
*{box-sizing:border-box}body{margin:0;padding:38px 24px;background:#f2ede6;color:#433b32;font-family:system-ui,-apple-system,sans-serif}main{max-width:1400px;margin:auto}header small{font-size:10px;letter-spacing:3px;color:#927760}h1{font-size:27px;font-weight:550;margin:16px 0 10px}p{font-size:13px;color:#8c7c6e;line-height:1.9}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{padding:11px 20px;border:1px solid #fff9;border-radius:11px;background:#f7f1e9;color:#7c5b44;box-shadow:4px 4px 9px #cbbba777,-4px -4px 9px #fff;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#e9ddce;box-shadow:inset 2px 2px 5px #c9b59c66,inset -2px -2px 5px #fff8}button:focus-visible{outline:2px solid #946b4e;outline-offset:3px}figure{margin:0}figcaption{font-size:12px;color:#8c7c6e;margin-bottom:14px;line-height:1.8}img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:8px 10px 24px #cbbba755;border:1px solid #fff9}.mobile img{max-width:390px;margin:auto}[hidden]{display:none!important}@media(max-width:600px){body{padding:26px 16px}h1{font-size:23px}button{padding:10px 12px}}
</style></head><body><main><header><small>THE FIFTH SEASON · IDEA COLLECTION</small><h1>先找到灵感，再展开思路。</h1><p>标题与开场先呈现，角度、目标和关键词按需展开。形式、脚本状态和账号可组合筛选，已有脚本直接打开。<br>以下为同一组隔离示例数据的实际浏览器截图，不连接云端。</p></header><nav aria-label="选题库改版对照"><button type="button" aria-pressed="true" data-panel="after">改版后</button><button type="button" aria-pressed="false" data-panel="before">改版前</button><button type="button" aria-pressed="false" data-panel="mobile">手机布局</button></nav><figure id="after"><figcaption>开场灵感独立呈现，选题思路可展开；脚本状态、加入待制作和查看脚本更容易找到。</figcaption><img src="topics.png" alt="新版选题库的开场灵感、组合筛选和脚本入口"></figure><figure id="before" hidden><figcaption>原版将角度、钩子、关键词和选题理由同时铺开，选题筛选集中在账号与搜索。</figcaption><img src="before.png" alt="改版前的选题库卡片"></figure><figure id="mobile" class="mobile" hidden><figcaption>手机上选题单列呈现，筛选自动换行；保留完整开场与底部待制作入口。</figcaption><img src="mobile.png" alt="手机上的选题卡片"></figure><p>查看脚本不会自动勾选选题；清除筛选保留当前批次范围。原有勾选保存与删除确认流程继续保留。</p></main><script>document.querySelector('nav').addEventListener('click',event=>{const button=event.target.closest('[data-panel]');if(!button)return;document.querySelectorAll('nav button').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));document.querySelectorAll('figure').forEach(el=>el.hidden=el.id!==button.dataset.panel)});</script></body></html>
