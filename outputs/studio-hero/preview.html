<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页 Hero · 模块响应动效</title><link rel="stylesheet" href="../../workbench/styles.css"><link rel="stylesheet" href="../../workbench/studio.css"><style>body{padding:40px 24px}.hero-preview{max-width:1300px;margin:auto}.preview-heading{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:24px}.preview-heading h1{font-size:24px;font-weight:550}.preview-heading p{font-size:12px;color:var(--muted);margin-top:8px}.preview-heading .eyebrow{font-size:9px}.preview-foot{font-size:11px;color:var(--muted);margin-top:22px}.creative-stage{min-height:430px}.creative-network{min-height:360px}.preview-toggle{display:flex;align-items:center;gap:10px;flex-shrink:0}@media(max-width:700px){body{padding:24px 16px}.preview-heading{align-items:flex-start;flex-direction:column;gap:14px}.creative-stage{min-height:0}.creative-network{min-height:330px}}</style></head><body><main class="hero-preview"><header class="preview-heading"><div><p class="eyebrow">THE FIFTH SEASON · INTERACTIVE HERO</p><h1>每一个模块，都有自己的回应。</h1><p>悬停、点击或用 Tab 选择模块，看柔光呼应方向，花瓣舒展，虚线流动。</p></div><div class="preview-toggle"><button class="motion-toggle" id="motionToggle" type="button" aria-label="界面动效" aria-pressed="true" hidden><span id="motionToggleLabel">动效开启</span></button></div></header><section id="view-home" class="view is-active">    <div class="creative-stage">
      <div class="stage-intro"><p class="eyebrow">THE FIFTH SEASON · STUDIO</p><h3>让每一个灵感，<br>都有下一步<span>。</span></h3><p class="stage-description">从发现风向，到作品发布。<br>把好内容，一点点做出来。</p><div class="stage-status" id="homeLoadState" role="status"><i></i>动效演示 · 示例数据</div><button class="stage-link" data-route="progress">查看创作进度 <span>↗</span></button></div>
      <div class="creative-network" aria-label="内容创作流程">
        <svg class="network-lines" viewBox="0 0 660 390" preserveAspectRatio="none" aria-hidden="true"><path data-network-route="materials" d="M330 195C250 195 200 85 125 85"/><path class="network-flow" data-network-route="materials" d="M330 195C250 195 200 85 125 85"/><path data-network-route="scripts" d="M330 195C420 195 430 80 535 80"/><path class="network-flow" data-network-route="scripts" d="M330 195C420 195 430 80 535 80"/><path data-network-route="video" d="M330 195C220 195 220 315 130 315"/><path class="network-flow" data-network-route="video" d="M330 195C220 195 220 315 130 315"/><path data-network-route="schedule" d="M330 195C420 195 440 310 535 310"/><path class="network-flow" data-network-route="schedule" d="M330 195C420 195 440 310 535 310"/></svg>
        <div class="creative-core" aria-hidden="true"><div class="core-aura"></div><div class="core-track"></div><div class="core-direction"></div><div class="core-response"></div><div class="core-orb"><div class="orb-form"><div class="orb-petals"><span class="orb-petal p1"></span><span class="orb-petal p2"></span><span class="orb-petal p3"></span><span class="orb-petal p4"></span><span class="orb-petal p5"></span></div></div><span class="orb-center"></span><span class="orb-light"></span></div><div class="core-label"><span id="coreModuleLabel">灵感，在这里生长</span><small id="coreModuleSub">CONTENT STUDIO</small></div></div>
        <button class="network-node node-top-left" data-route="materials"><span class="node-orb">✦</span><span class="node-caption"><span><b id="homeMaterialCount">24</b> 个灵感</span><strong>风口选题 <em>↗</em></strong><small>DISCOVER</small></span></button>
        <button class="network-node node-top-right" data-route="scripts"><span class="node-orb">✎</span><span class="node-caption"><span><b id="homeScriptCount">7</b> 份脚本</span><strong>拍摄辅助 <em>↗</em></strong><small>CREATE</small></span></button>
        <button class="network-node node-bottom-left" data-route="video"><span class="node-orb">▷</span><span class="node-caption"><span>剪辑 / AI 生成</span><strong>视频制作 <em>↗</em></strong><small>PRODUCE</small></span></button>
        <button class="network-node node-bottom-right" data-route="schedule"><span class="node-orb">▦</span><span class="node-caption"><span><b id="homeScheduleCount">9</b> 条排期</span><strong>发布日历 <em>↗</em></strong><small>PUBLISH</small></span></button>
      </div>
      <div class="stage-footer"><span><i></i>灵感与作品，相互连接</span><button data-route="data">让数据带来下一个灵感 ↗</button></div>
    </div>
</section><p class="preview-foot">交互演示 · 示例数量 · 本页不连接云端。保留原来的暖色与虚线；关闭动效后仍能看到模块对应的形态。 <a href="hero.webm">查看录屏</a></p></main><script src="../../workbench/studio-motion.js"></script></body></html>
