<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作台 · 操作与阅读层次</title><style>
*{box-sizing:border-box}body{margin:0;padding:36px 24px;background:#eae4dc;color:#332b26;font-family:system-ui,-apple-system,sans-serif}main{max-width:1440px;margin:auto}header small{font-size:10px;letter-spacing:2px;color:#75665b}h1{font-size:28px;font-weight:600;margin:15px 0 10px}p,figcaption{font-size:13px;line-height:1.9;color:#6b5d53}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{min-height:44px;padding:10px 17px;border:1px solid #c6b8a8;border-radius:10px;background:#fcf9f4;color:#6e432f;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#80513c;color:#fffaf6;border-color:#80513c}button:focus-visible{outline:2px solid #8a5a44;outline-offset:3px}figure{margin:0}figcaption{margin-bottom:14px}img{display:block;width:100%;height:auto;border:1px solid #c6b8a8;border-radius:16px;box-shadow:0 5px 14px #68513a14}.mobile img{max-width:390px;margin:auto}[hidden]{display:none!important}@media(max-width:600px){body{padding:24px 14px}h1{font-size:23px}}
</style></head><body><main><header><small>THE FIFTH SEASON · WORKSPACE CLARITY</small><h1>操作更醒目，内容更好读。</h1><p>「开始制作」成为脚本卡片的主按钮；页面、面板、卡片和分镜预览有了清晰层次。保留暖色与立体细节，收紧大面积柔光。<br>以下为同一组隔离示例数据的浏览器截图，可离线查看。</p></header>
<nav aria-label="改版对照"><button aria-pressed="true" data-panel="scripts-after">脚本库 · 新版</button><button aria-pressed="false" data-panel="scripts-before">脚本库 · 旧版</button><button aria-pressed="false" data-panel="scripts-mobile">手机主按钮</button><button aria-pressed="false" data-panel="data-after">数据看板 · 新版</button><button aria-pressed="false" data-panel="data-before">数据看板 · 旧版</button></nav>
<figure id="scripts-after"><figcaption>桌面端的制作按钮至少 148px 宽、46px 高；次要操作也有至少 44px 的点击高度。</figcaption><img src="scripts-after.png" alt="新版脚本库，棕色开始制作按钮与独立操作区"></figure>
<figure id="scripts-before" hidden><figcaption>旧版：制作入口为小号文字链接，面板、卡片和页面底色相近。</figcaption><img src="scripts-before.png" alt="改版前脚本库"></figure>
<figure id="scripts-mobile" class="mobile" hidden><figcaption>手机端制作按钮独占一行，至少 48px 高，查看与拍摄操作并列。</figcaption><img src="scripts-mobile.png" alt="手机上的全宽开始制作按钮"></figure>
<figure id="data-after" hidden><figcaption>新版：加深页面底色，面板使用浅奶油色与暖灰边框，缩小阴影范围。</figcaption><img src="data-after.png" alt="新版数据看板的面板、指标卡和图表层次"></figure>
<figure id="data-before" hidden><figcaption>旧版：白色边框与双向柔光使各区块边缘较难分辨。</figcaption><img src="data-before.png" alt="改版前数据看板"></figure>
</main><script>document.querySelector('nav').addEventListener('click',event=>{const button=event.target.closest('[data-panel]');if(!button)return;document.querySelectorAll('nav button').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));document.querySelectorAll('figure').forEach(el=>el.hidden=el.id!==button.dataset.panel)});</script></body></html>
